spring.application.name=city-bottleneck-api
server.port=${PORT:8080}
traffic.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
traffic.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
traffic.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
traffic.user-agent=${TRAFFIC_USER_AGENT:CityBottleneckExplorer/0.1 (course project)}
traffic.upstream.connect-timeout=${UPSTREAM_CONNECT_TIMEOUT:4s}
traffic.upstream.read-timeout=${UPSTREAM_READ_TIMEOUT:12s}